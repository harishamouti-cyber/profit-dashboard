# This file stores configurations for your Shopify app.
client_id = "6474e91891fa0d5cd17324e435e39220"
name = "Penni: Net Profit Tracker"
application_url = "https://penni-app.netlify.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
scopes = "read_orders,read_products,read_inventory"

[auth]
redirect_urls = [ "https://penni-app.netlify.app/auth/callback", "https://penni-app.netlify.app/api/auth" ]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = ["orders/create", "orders/updated", "orders/cancelled", "orders/delete"]
  uri = "/webhooks/orders"

  [[webhooks.subscriptions]]
  topics = ["refunds/create"]
  uri = "/webhooks/refunds"

  [[webhooks.subscriptions]]
  topics = ["products/update", "inventory_items/update"]
  uri = "/webhooks/catalog"

  [[webhooks.subscriptions]]
  topics = ["app_subscriptions/update"]
  uri = "/webhooks/billing"

  [[webhooks.subscriptions]]
  topics = ["bulk_operations/finish"]
  uri = "/webhooks/bulk"

  [[webhooks.subscriptions]]
  topics = ["shop/update"]
  uri = "/webhooks/shop"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/compliance"
