# This file stores configurations for your Shopify app.
client_id = ""
name = "Profit Dashboard"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_products,read_inventory"
# Request later (needs Shopify approval in the Partner Dashboard): read_all_orders
# Not in v1: read_shopify_payments_payouts. Fees come from OrderTransaction.fees.

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = ["orders/create", "orders/updated", "orders/cancelled", "orders/delete"]
  uri = "/webhooks/orders"

  [[webhooks.subscriptions]]
  topics = ["refunds/create"]
  uri = "/webhooks/refunds"

  [[webhooks.subscriptions]]
  topics = ["products/update", "inventory_items/update"]
  uri = "/webhooks/catalog"

  [[webhooks.subscriptions]]
  topics = ["app_subscriptions/update"]
  uri = "/webhooks/billing"

  [[webhooks.subscriptions]]
  topics = ["bulk_operations/finish"]
  uri = "/webhooks/bulk"

  [[webhooks.subscriptions]]
  topics = ["shop/update"]
  uri = "/webhooks/shop"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/compliance"
