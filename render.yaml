# Render blueprint: one web service, one worker, one Postgres database.
# The web process serves HTTP. The worker runs the job poll and the 15-minute reconcile.
# Web sets DISABLE_EMBEDDED_WORKER=1 so a scaled web service does not run two queues.

databases:
  - name: profit-dashboard-db
    databaseName: profit_dashboard
    plan: basic-256mb

services:
  - type: web
    name: profit-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: profit-dashboard-db
          property: connectionString
      - key: DISABLE_EMBEDDED_WORKER
        value: "1"
      - key: NODE_ENV
        value: production
      # manual_raw matches "Manual pricing" in the Partner Dashboard. Use shopify_app_pricing
      # only if you switch the app to Shopify App Pricing and create the plans there.
      - key: BILLING_MODE
        value: manual_raw
      - key: SHOPIFY_APP_HANDLE
        value: profit-dashboard-214
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: read_orders,read_products,read_inventory

  - type: worker
    name: profit-dashboard-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    # The web service runs migrations on start (npm run docker-start). The worker only polls jobs.
    dockerCommand: node build/worker.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: profit-dashboard-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      # Required: shopifyApp() refuses to start without a valid app URL, even in the worker.
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: read_orders,read_products,read_inventory
