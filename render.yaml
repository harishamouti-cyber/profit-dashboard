# Render blueprint: one FREE web service. The database is external (Neon free Postgres).
# The web process serves HTTP and also runs the embedded job loop and the 15-minute reconcile
# (DISABLE_EMBEDDED_WORKER is intentionally NOT set). Do not scale this service past one instance
# unless you add a separate worker and set DISABLE_EMBEDDED_WORKER=1 on web.
# Migrations run on container start (npm run docker-start -> prisma migrate deploy).
# Use Neon's DIRECT (non "-pooler") connection string for DATABASE_URL so prisma migrate works.

services:
  - type: web
    name: penni
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      # manual_raw matches "Manual pricing" in the Partner Dashboard.
      - key: BILLING_MODE
        value: manual_raw
      - key: SHOPIFY_APP_HANDLE
        value: profit-dashboard-214
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: read_orders,read_products,read_inventory
